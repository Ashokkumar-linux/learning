<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sustainability Consulting</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="projects.html">Our Projects</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <section class="contact-form-section">
            <form action="mailto:contact@sustainability.com" method="POST" enctype="text/plain">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
                <label for="message">Message/Project Goal:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section class="map-section">
            <h2>Our Location</h2>
            <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-74.0059,40.7128,-73.9959,40.7228&layer=mapnik"
                    style="border: 0; width: 100%; height: 450px;" allowfullscreen="" loading="lazy"></iframe>
        </section>
        <section class="accreditations-section">
            <h2>Our Accreditations</h2>
            <div class="accreditation-logos">
                <img src="https://via.placeholder.com/150x60.png?text=Accreditation+1" alt="Accreditation 1">
                <img src="https://via.placeholder.com/150x60.png?text=Accreditation+2" alt="Accreditation 2">
            </div>
        </section>
    </main>
    <script src="../scripts/script.js"></script>
</body>
</html>
