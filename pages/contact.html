<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GreenBuild Consulting</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="../index.html" class="logo">GreenBuild</a>
                <ul class="nav-list">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="projects.html">Our Projects</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Contact Us</h1>
                <p>Start your certification journey today.</p>
            </div>
        </section>

        <section class="contact-form-section">
            <div class="container">
                <div class="contact-container">
                    <div class="contact-form">
                        <h2>Get a Free Consultation</h2>
                        <form action="mailto:contact@greenbuild.com" method="post" enctype="text/plain">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            <div class="form-group">
                                <label for="message">Message / Project Goal</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </form>
                    </div>
                    <div class="contact-map">
                        <h2>Our Location</h2>
                        <iframe
                            src="https://www.openstreetmap.org/export/embed.html?bbox=-74.0059,40.7128,-73.9959,40.7228&layer=mapnik"
                            width="100%"
                            height="450"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

        <section class="accreditations">
            <div class="container">
                <h2>Our Accreditations</h2>
                <div class="logos">
                    <img src="https://placehold.co/150x80?text=USGBC" alt="USGBC Member Logo">
                    <img src="https://placehold.co/150x80?text=CII" alt="CII Member Logo">
                    <img src="https://placehold.co/150x80?text=TERI" alt="TERI Member Logo">
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 GreenBuild Consulting. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
